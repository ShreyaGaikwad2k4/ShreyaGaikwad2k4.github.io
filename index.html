<!-- CSS Mission Demo 1: HTML& CSS Code -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e2ecfa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 50px 0;
        }
        .container {
            text-align: center;
        }
        .logo {
            font-size: 40px;
            color: #1877f2;
            font-weight: bold;
            text-align: center;
        }
        .login-box {
            background-color: #fff;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        .login-box input {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #1877f2;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-box a {
            display: block;
            margin: 10px 0;
            color: #1877f2;
            text-decoration: none;
        }
        .create-account {
            background-color: #1877f2;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ElevateDev</div>
        <p>ElevateDev helps you connect and share with the people in your work.</p>
        <div class="login-box">
            <input type="text" placeholder="Email address or phone number">
            <input type="password" placeholder="Password">
            <button>Log in</button>
            <a href="#">Forgotten password?</a>
            <button class="create-account">Create new account</button>
        </div>
        <p><a href="#">Create a Page</a> for a celebrity, brand or business.</p>
    </div>

    <script src="login.js"></script>

</body>
</html>
